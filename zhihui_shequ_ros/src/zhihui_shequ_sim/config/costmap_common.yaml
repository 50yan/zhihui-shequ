footprint: [[-0.34, -0.27], [-0.34, 0.27], [0.34, 0.27], [0.34, -0.27]]
transform_tolerance: 0.5
map_type: costmap

obstacle_layer:
  enabled: true
  obstacle_range: 3.5
  raytrace_range: 5.0
  observation_sources: scan
  scan:
    sensor_frame: lidar_link
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    inf_is_valid: true

inflation_layer:
  enabled: true
  inflation_radius: 0.30
  cost_scaling_factor: 8.0

static_layer:
  enabled: true
  map_topic: /map
  subscribe_to_updates: true
